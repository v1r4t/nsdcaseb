<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="What happens when students stop waiting for the future and start building it? NSDC at Amrita Bengaluru — events, projects and research in the open."
    />
    <meta name="theme-color" content="#f2eee3" />
    <link rel="icon" type="image/png" href="/brand/favicon-512.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="canonical" href="https://nsdcaseb.xyz/" />
    <!-- Self-hosted kit fonts (public/fonts/). Preload the display and body faces. -->
    <link
      rel="preload"
      href="/fonts/bespoke-serif-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/switzer-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Default social card. Per-route pages may override title/description client-side. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NSDC — National Student Data Corps" />
    <meta property="og:title" content="NSDC — National Student Data Corps" />
    <meta
      property="og:description"
      content="What happens when students stop waiting for the future and start building it? NSDC at Amrita Bengaluru — events, projects and research in the open."
    />
    <meta property="og:url" content="https://nsdcaseb.xyz/" />
    <meta property="og:image" content="https://nsdcaseb.xyz/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="NSDC — National Student Data Corps, Amrita Bengaluru"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NSDC — National Student Data Corps" />
    <meta
      name="twitter:description"
      content="What happens when students stop waiting for the future and start building it? NSDC at Amrita Bengaluru — events, projects and research in the open."
    />
    <meta name="twitter:image" content="https://nsdcaseb.xyz/og-default.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "National Student Data Corps",
        "alternateName": "NSDC",
        "url": "https://nsdcaseb.xyz/",
        "logo": "https://nsdcaseb.xyz/nsdc_logo.png",
        "description": "A student technology community at Amrita Vishwa Vidyapeetham, Bengaluru.",
        "sameAs": [
          "https://www.instagram.com/nsdc_avvb/",
          "https://www.linkedin.com/company/nsdc-avv-b"
        ]
      }
    </script>
    <title>NSDC — National Student Data Corps</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      No-JS fallback. Kept inline (no classes, no external CSS) so it renders
      with scripting disabled and before any stylesheet loads. It sits after
      #root so the hydrated SPA is never displaced; browsers do not parse the
      contents of <noscript> when scripting is enabled.
    -->
    <noscript>
      <main
        style="max-width: 40rem; margin: 0 auto; padding: 3rem 1.5rem; background: #f2eee3; color: #111110; font-family: Georgia, 'Times New Roman', serif; line-height: 1.5;"
      >
        <p
          style="margin: 0 0 0.75rem; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #5f5b53;"
        >
          NSDC — National Student Data Corps · Amrita Vishwa Vidyapeetham, Bengaluru
        </p>
        <h1 style="margin: 0 0 1rem; font-size: 2rem; font-weight: 400; line-height: 1.12;">
          What happens when students stop waiting for the future and start building it?
        </h1>
        <p style="margin: 0 0 1rem; font-size: 1.0625rem;">
          NSDC is the National Student Data Corps chapter at Amrita Bengaluru — a student data
          community running events, projects and research in the open.
        </p>
        <p style="margin: 0; font-size: 1rem;">
          Contact:
          <a href="mailto:nsdcaseb@gmail.com" style="color: #b33c1b;">nsdcaseb@gmail.com</a>
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
